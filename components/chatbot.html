<div class="chatbot-container">
    <button type="button" class="chatbot-toggle" aria-label="Open the B &amp; K assistant" aria-expanded="false" aria-controls="bk-chat">
        <div class="chatbot-icon"><svg class="ic" aria-hidden="true" focusable="false"><use href="assets/icons/sprite.svg#comments"></use></svg></div>
        <div class="chatbot-tooltip">How can we help?</div>
    </button>

    <div class="chatbot-window" id="bk-chat" role="dialog" aria-label="B &amp; K assistant">
        <div class="chatbot-header">
            <div class="chatbot-header-info">
                <div class="chatbot-avatar"><img src="assets/brand/mark-white.svg" alt="" width="24" height="24"></div>
                <div class="chatbot-title">
                    <h4>B &amp; K Assistant</h4>
                    <span class="chatbot-status"><span class="status-dot"></span>We reply the same business day</span>
                </div>
            </div>
            <button type="button" class="chatbot-close" aria-label="Close the assistant"><svg class="ic" aria-hidden="true" focusable="false"><use href="assets/icons/sprite.svg#times"></use></svg></button>
        </div>
        <div class="chatbot-messages" aria-live="polite"></div>
        <div class="chatbot-input-area">
            <p class="chatbot-disclaimer"><svg class="ic" aria-hidden="true" focusable="false"><use href="assets/icons/sprite.svg#shield-alt"></use></svg> Guided answers only. Nothing you tap here is stored.</p>
        </div>
    </div>
</div>
